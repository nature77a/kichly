<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login — Kitchly Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  html, body { margin:0; padding:0; font-family:"Plus Jakarta Sans", sans-serif; background:#fbf9f6; }
  input:focus { outline:none; border-color:#a93119; box-shadow:0 0 0 3px rgba(169,49,25,0.12); }
</style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm bg-white rounded-2xl shadow-lg border border-[#e4e2df] p-8">
    <div class="flex items-center gap-2 justify-center mb-1">
      <div class="w-9 h-9 rounded-lg bg-[#a93119] flex items-center justify-center text-white font-bold">K</div>
      <span class="text-xl font-semibold text-[#1b1c1a]">Kitchly</span>
    </div>
    <p class="text-center text-sm text-[#59413c] mb-6">Operations Dashboard</p>

    <form id="loginForm" class="flex flex-col gap-4">
      <div>
        <label class="text-xs font-semibold uppercase text-[#59413c]">Username</label>
        <input id="usernameInput" type="text" autocomplete="username" required
          class="w-full h-12 px-4 mt-1.5 rounded-xl border border-[#e0bfb8] text-sm"/>
      </div>
      <div>
        <label class="text-xs font-semibold uppercase text-[#59413c]">Password</label>
        <input id="passwordInput" type="password" autocomplete="current-password" required
          class="w-full h-12 px-4 mt-1.5 rounded-xl border border-[#e0bfb8] text-sm"/>
      </div>
      <p id="loginError" class="hidden text-sm text-red-600"></p>
      <button type="submit" id="loginBtn"
        class="w-full h-12 rounded-xl bg-[#a93119] text-white font-semibold text-sm mt-2 disabled:opacity-60">
        Log In
      </button>
    </form>
  </div>

<script src="supabase-config.js"></script>
<script>
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const username = document.getElementById("usernameInput").value;
    const password = document.getElementById("passwordInput").value;
    const btn = document.getElementById("loginBtn");
    const errorEl = document.getElementById("loginError");
    errorEl.classList.add("hidden");
    btn.disabled = true;
    btn.textContent = "Logging in…";

    const { error } = await supabaseClient.auth.signInWithPassword({
      email: usernameToEmail(username),
      password: password
    });

    if (error) {
      errorEl.textContent = "Incorrect username or password.";
      errorEl.classList.remove("hidden");
      btn.disabled = false;
      btn.textContent = "Log In";
      return;
    }
    window.location.href = "index.html";
  });

  // If already logged in, skip straight to dashboard
  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) window.location.href = "index.html";
  })();
</script>
</body>
</html>
