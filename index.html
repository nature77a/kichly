<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Dashboard — Kitchly</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  html, body { margin:0; padding:0; font-family:"Plus Jakarta Sans", sans-serif; background:#f7f5f2; }
  ::-webkit-scrollbar { display:none; }
</style>
</head>
<body class="min-h-screen flex text-[#1b1c1a]">

<aside class="w-64 shrink-0 bg-white border-r border-[#e4e2df] flex flex-col min-h-screen" id="sidebarContainer"></aside>

<main class="flex-1 p-6 lg:p-10 max-w-6xl">
  <div class="flex items-center justify-between flex-wrap gap-3 mb-6">
    <div>
      <h1 class="text-2xl font-semibold">Dashboard</h1>
      <p class="text-sm text-[#59413c]">Daily order overview and quick actions.</p>
    </div>
    <a href="../index.html" target="_blank" class="px-4 py-2.5 rounded-xl bg-[#1b1c1a] text-white text-sm font-semibold flex items-center gap-2">
      <span class="material-symbols-outlined text-[18px]">open_in_new</span> Live Storefront
    </a>
  </div>

  <!-- Stat cards -->
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
    <div class="bg-white rounded-2xl border border-[#e4e2df] p-5">
      <p class="text-xs uppercase font-semibold text-[#59413c]">Today's Orders</p>
      <p id="statToday" class="text-3xl font-bold mt-2">—</p>
      <p id="statGrossVol" class="text-xs text-[#59413c] mt-1"></p>
    </div>
    <div class="bg-white rounded-2xl border border-[#e4e2df] p-5">
      <p class="text-xs uppercase font-semibold text-[#a93119]">Pending Confirmation</p>
      <p id="statPending" class="text-3xl font-bold mt-2">—</p>
      <p class="text-xs text-[#59413c] mt-1">Awaiting WhatsApp confirmation</p>
    </div>
    <div class="bg-white rounded-2xl border border-[#e4e2df] p-5">
      <p class="text-xs uppercase font-semibold text-red-600">Needs Action</p>
      <p id="statNeedsAction" class="text-3xl font-bold mt-2">—</p>
      <p class="text-xs text-[#59413c] mt-1">Returned / refused by customer</p>
    </div>
  </div>

  <!-- Recent orders -->
  <div class="bg-white rounded-2xl border border-[#e4e2df] p-5">
    <div class="flex items-center justify-between mb-4">
      <h2 class="font-semibold text-lg">Recent Orders</h2>
      <a href="orders.html" class="text-[#a93119] text-sm font-semibold">View All Orders →</a>
    </div>
    <div id="recentOrdersList" class="flex flex-col divide-y divide-[#e4e2df]">
      <p class="text-sm text-[#59413c] py-6 text-center">Loading…</p>
    </div>
  </div>

  <a href="product-edit.html" class="mt-6 inline-flex items-center gap-2 px-5 py-3 rounded-xl border border-[#e0bfb8] text-sm font-semibold text-[#a93119]">
    <span class="material-symbols-outlined text-[18px]">add_circle</span> Add New Product
  </a>
</main>

<script src="supabase-config.js"></script>
<script src="sidebar.js"></script>
<script>
const STATUS_COLORS = {
  pending: { dot: "bg-orange-500", label: "Pending" },
  confirmed: { dot: "bg-blue-500", label: "Confirmed" },
  delivered: { dot: "bg-green-500", label: "Delivered" },
  rejected: { dot: "bg-red-500", label: "Rejected" },
  returned: { dot: "bg-purple-500", label: "Returned" }
};

function formatPKR(n) { return "Rs. " + Math.round(n).toLocaleString("en-PK"); }

async function init() {
  const session = await requireAuth();
  if (!session) return;
  renderSidebar("dashboard");
  document.getElementById("sidebarUsername").textContent = session.user.email.split("@")[0];

  await loadStats();
  await loadRecentOrders();
}

async function loadStats() {
  const startOfToday = new Date();
  startOfToday.setHours(0,0,0,0);

  const { data: todayOrders } = await supabaseClient
    .from("orders")
    .select("total_price")
    .gte("created_at", startOfToday.toISOString());

  document.getElementById("statToday").textContent = (todayOrders || []).length;
  const grossVol = (todayOrders || []).reduce((sum, o) => sum + Number(o.total_price), 0);
  document.getElementById("statGrossVol").textContent = "Gross Vol: " + formatPKR(grossVol);

  const { count: pendingCount } = await supabaseClient
    .from("orders").select("id", { count: "exact", head: true }).eq("status", "pending");
  document.getElementById("statPending").textContent = pendingCount || 0;

  const { count: returnedCount } = await supabaseClient
    .from("orders").select("id", { count: "exact", head: true }).eq("status", "returned");
  document.getElementById("statNeedsAction").textContent = returnedCount || 0;
}

async function loadRecentOrders() {
  const { data, error } = await supabaseClient
    .from("orders")
    .select("id, customer_name, whatsapp_number, status, total_price, created_at, products(title)")
    .order("created_at", { ascending: false })
    .limit(5);

  const list = document.getElementById("recentOrdersList");
  if (error || !data || data.length === 0) {
    list.innerHTML = '<p class="text-sm text-[#59413c] py-6 text-center">No orders yet.</p>';
    return;
  }

  list.innerHTML = data.map(order => {
    const status = STATUS_COLORS[order.status] || STATUS_COLORS.pending;
    return `
      <a href="orders.html?id=${order.id}" class="flex items-center gap-3 py-3 hover:bg-[#fbf9f6] px-2 rounded-lg">
        <span class="w-2.5 h-2.5 rounded-full ${status.dot} shrink-0"></span>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-semibold truncate">${order.customer_name}</p>
          <p class="text-xs text-[#59413c] truncate">${order.products ? order.products.title : "—"}</p>
        </div>
        <span class="text-sm font-semibold shrink-0">${formatPKR(order.total_price)}</span>
      </a>
    `;
  }).join("");
}

init();
</script>
</body>
</html>
